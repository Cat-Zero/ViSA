
MODEL:
  META_ARCHITECTURE: Baseline_multiview_ViSA
  PIXEL_MEAN: [127.5, 127.5, 127.5]
  PIXEL_STD: [127.5, 127.5, 127.5]
  USE_VISA: True

  BACKBONE:
    NAME: build_multiview_vit_backbone_ViSA
    DEPTH: base
    FEAT_DIM: 768
    PRETRAIN: True
    PRETRAIN_PATH: ./jx_vit_base_p16_224-80ecf9dd.pth
    STRIDE_SIZE: (12,10)
    DROP_PATH_RATIO: 0.1
    DROP_RATIO: 0.0
    ATT_DROP_RATE: 0.0
    INNER_SUB: True
    PROMPT_LEN: 8
    PROMPT_DEPTH: 2
    USE_PRM: True
    EXPERTS: 8
    TOP_K: 3
    GRAPH_TOP_K: 64

  HEADS:
    NAME: EmbeddingHead
    NORM: BN
    WITH_BNNECK: True
    POOL_LAYER: Identity
    NECK_FEAT: before
    CLS_LAYER: Linear

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss",)

    CE:
      EPSILON: 0.
      SCALE: 1.
      # view-related learning
      VIEW_ID: True
      VIEW_OREG: True
      VIEW_LAMBDA: 1.0

    TRI:
      MARGIN: 0.0
      HARD_MINING: True
      NORM_FEAT: False
      SCALE: 1.



INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]

#  CAMERA: 21

  REA:
    ENABLED: True
    PROB: 0.5

  FLIP:
    ENABLED: True

  PADDING:
    ENABLED: True

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 8
  NUM_WORKERS: 8

SOLVER:
  AMP:
    ENABLED: True
  OPT: SGD
  MAX_EPOCH: 120
  BASE_LR: 0.008
  WEIGHT_DECAY: 0.0001
  IMS_PER_BATCH: 128

  SCHED: CosineAnnealingLR
  ETA_MIN_LR: 0.0000016

  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 2000

  CLIP_GRADIENTS:
    ENABLED: True

  CHECKPOINT_PERIOD: 5

TEST:
  EVAL_PERIOD: 50
  IMS_PER_BATCH:  384

CUDNN_BENCHMARK: True

DATASETS:
  NAMES: ("LAGPeR",)
  TESTS: ("LAGPeR_A2G", "LAGPeR_G2A", "LAGPeR_G2AG", )

OUTPUT_DIR: logs/LAGPeR/ViSA
